<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUR PARTY</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f17;
            --surface-color: #161f2e;
            --surface-hover: #1f2c40;
            --border-color: #2a3a52;
            --primary-accent: #ee073d; /* Flame Amber */
            --primary-hover: #ffd700;
            --text-main: #f8fafc;
            --text-muted: #afc4e2;
            --danger: #ef4444;
            --like-color: #2cb910;
            --dislike-color: #be1834;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-accent), #e4c746);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 800;
            color: #000;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Navigation Systems */
        .nav-container {
            background-color: rgba(22, 31, 46, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 65px;
            z-index: 90;
            display: flex;
            flex-direction: column;
        }

        .horizontal-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.75rem 2rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .horizontal-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .pages-bar {
            background-color: rgba(11, 15, 23, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-item {
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            user-select: none;
        }

        .category-item:hover {
            border-color: var(--primary-accent);
            color: var(--text-main);
        }

        .category-item.active {
            background-color: var(--primary-accent);
            color: #000;
            border-color: var(--primary-accent);
        }

        .node-admin-actions {
            display: none;
            margin-left: 8px;
            gap: 6px;
            align-items: center;
        }

        .node-admin-actions.visible {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .node-admin-btn {
            opacity: 0.6;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .node-admin-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Buttons & Forms */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary-accent);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: var(--surface-hover);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #fff;
        }

        /* Main Content */
        main {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex-grow: 1;
        }

        .article-container {
            margin-bottom: 3rem;
        }

        .content-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .page-hero-img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .page-body {
            padding: 2rem;
        }

        .page-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-text {
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 1.05rem;
            white-space: pre-line;
            margin-bottom: 2rem;
        }

        /* Interaction Bar */
        .interaction-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .vote-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .vote-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .vote-btn.liked {
            border-color: var(--like-color);
            color: var(--like-color);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .vote-btn.disliked {
            border-color: var(--dislike-color);
            color: var(--dislike-color);
            background-color: rgba(244, 63, 94, 0.1);
        }

        /* Comments Section */
        .comments-section {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1rem;
        }

        .comments-title {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        textarea, input[type="text"], input[type="url"], select {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input:focus, select:focus {
            border-color: var(--primary-accent);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .comment-author {
            font-weight: 700;
            color: var(--primary-accent);
        }

        .comment-actions {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        .comment-btn-sm {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .comment-btn-sm:hover {
            opacity: 1;
        }

        /* Admin Controls Toolbar */
        .admin-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--primary-accent);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 550px;
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .hidden { display: none !important; }
        
        /* Welcome Screen */
        .welcome-screen {
            text-align: center;
            padding: 4rem 1rem;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1rem 0;
        }

        .emoji-btn {
            font-size: 2rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .emoji-btn:hover {
            border-color: var(--primary-accent);
            background: rgba(255,255,255,0.05);
            transform: scale(1.05);
        }

        .emoji-preview-box {
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 1.5rem;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 4px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="goHome()">
            <div class="brand-logo">OP</div>
            <div>
                <div class="brand-title">OUR</div>
                <div class="brand-subtitle">PARTY</div>
            </div>
        </div>
        <div class="user-controls">
            <span id="roleBadge" class="hidden" style="font-size:0.75rem; background:var(--primary-accent); color:#000; font-weight:800; padding:2px 8px; border-radius:4px;">ADMIN</span>
            <button id="authBtn" class="btn btn-outline">Sign In with Gmail</button>
        </div>
    </header>

    <div class="nav-container" id="navContainer">
        </div>

    <main>
        <div id="adminPanel" class="admin-controls hidden">
            <span style="font-weight:700; font-size:0.9rem;">⚡ Admin Command Bar</span>
            <div style="display:flex; gap:0.5rem; flex-wrap: wrap;">
                <button class="btn btn-outline" id="addCategoryBtn" style="border-color: var(--primary-accent); color: var(--primary-accent);">+ New Category (Sibling)</button>
                <button class="btn btn-outline" id="addPageBtn" style="border-color: var(--primary-hover); color: var(--primary-hover);">+ New Page (Child)</button>
                <button class="btn btn-primary" id="addArticleBtn">+ New Article Here</button>
            </div>
        </div>

        <div id="contentDisplay">
            </div>
    </main>

    <div class="modal" id="nodeModal">
        <div class="modal-content">
            <h3 id="nodeModalTitle">Add Item</h3>
            <input type="text" id="nodeTitleInput" placeholder="Name (e.g. Technology, My Page)">
            <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" id="saveNodeBtn">Save Item</button>
            </div>
        </div>
    </div>

    <div class="modal" id="nodeMoveModal">
        <div class="modal-content" style="max-width: 450px;">
            <h3>Move Section</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">
                Select target parent section. This section and all contained sub-pages & articles will move with it:
            </p>
            <select id="nodeMoveDestinationSelect"></select>
            <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top: 1.5rem;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" id="confirmNodeMoveBtn">Confirm Move</button>
            </div>
        </div>
    </div>

    <div class="modal" id="articleModal">
        <div class="modal-content">
            <h3 id="articleModalTitle">Add Article</h3>
            <input type="text" id="articleTitleInput" placeholder="Article Title">
            <input type="url" id="articleImageInput" placeholder="Image URL (Optional)">
            <textarea id="articleContentInput" rows="6" placeholder="Write article content here..."></textarea>
            <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" id="saveArticleBtn">Save Article</button>
            </div>
        </div>
    </div>

    <div class="modal" id="emojiModal">
        <div class="modal-content" style="max-width: 380px; text-align: center;">
            <h3>Select Icons (Max 5)</h3>
            <div class="emoji-preview-box" id="emojiPreview">
                <span style="color:var(--text-muted); font-size:0.9rem;">No icon selected</span>
            </div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="toggleEmoji('🔷')">🔷</button>
                <button class="emoji-btn" onclick="toggleEmoji('🔹')">🔹</button>
                <button class="emoji-btn" onclick="toggleEmoji('‼')">‼</button>
                <button class="emoji-btn" onclick="toggleEmoji('💭')">💭</button>
                <button class="emoji-btn" onclick="toggleEmoji('🔜')">🔜</button>
                <button class="emoji-btn" onclick="toggleEmoji('🌐')">🌐</button>
            </div>
            <div style="display:flex; justify-content:space-between; gap:0.5rem; margin-top: 1rem;">
                <button class="btn btn-outline" onclick="clearSelectedEmojis()">Clear All</button>
                <div style="display:flex; gap:0.5rem;">
                    <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                    <button class="btn btn-primary" onclick="confirmEmojiSelection()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="moveModal">
        <div class="modal-content" style="max-width: 450px;">
            <h3>Move Article</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Select the new destination page or category for this article:</p>
            <select id="moveDestinationSelect"></select>
            <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top: 1.5rem;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" id="confirmMoveBtn">Confirm Move</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

     const firebaseConfig = {
  apiKey: "AIzaSyAKTU5AWs20Ep7_23HCz6hqXqaASn_SZz4",
  authDomain: "our-school-585fd.firebaseapp.com",
  projectId: "our-school-585fd",
  storageBucket: "our-school-585fd.firebasestorage.app",
  messagingSenderId: "1058799296440",
  appId: "1:1058799296440:web:4018915145043ddf10b94d",
  measurementId: "G-FGM87QJ0C7"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Application State
        let currentUser = null;
        let userRole = 'user';
        
        let oldCategories = [];
        let allPages = [];
        let nodes = []; 
        let activePath = []; 
        
        let articlesUnsubscribe = null;
        let commentsUnsubscribers = [];
        
        let editingNodeId = null;
        let nodeParentTarget = null; 
        
        let editingArticleId = null;
        let isEditingLegacyArticle = false;
        
        let nodeForEmoji = null;
        let selectedEmojis = [];

        let nodeToMoveId = null;

        let articleToMoveId = null;
        let articleToMoveIsLegacy = false;
        let articleToMoveSourceId = null;

        // DOM Elements
        const authBtn = document.getElementById('authBtn');
        const roleBadge = document.getElementById('roleBadge');
        const adminPanel = document.getElementById('adminPanel');
        const navContainer = document.getElementById('navContainer');
        const contentDisplay = document.getElementById('contentDisplay');

        // --- GLOBAL CLOSE MODALS ---
        window.closeModals = () => {
            document.getElementById('nodeModal').style.display = 'none';
            document.getElementById('nodeMoveModal').style.display = 'none';
            document.getElementById('articleModal').style.display = 'none';
            document.getElementById('emojiModal').style.display = 'none';
            document.getElementById('moveModal').style.display = 'none';
        };

        // --- AUTHENTICATION ---
        authBtn.addEventListener('click', () => {
            if (currentUser) signOut(auth);
            else signInWithPopup(auth, provider);
        });

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                authBtn.innerText = "Sign Out (" + user.displayName.split(' ')[0] + ")";
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    userRole = userSnap.data().role || 'user';
                } else {
                    await setDoc(userRef, { email: user.email, role: 'user' });
                    userRole = 'user';
                }
            } else {
                currentUser = null;
                userRole = 'user';
                authBtn.innerText = "Sign In with Gmail";
            }
            updateRoleUI();
        });

        function updateRoleUI() {
            if (userRole === 'admin') {
                roleBadge.classList.remove('hidden');
                adminPanel.classList.remove('hidden');
            } else {
                roleBadge.classList.add('hidden');
                adminPanel.classList.add('hidden');
            }
            renderNav();
            if (activePath.length > 0) loadArticles();
        }

        // --- HYBRID FIRESTORE FETCHING ---
        onSnapshot(collection(db, "categories"), (snapshot) => {
            oldCategories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            mergeNodes();
        });

        onSnapshot(collection(db, "pages"), (snapshot) => {
            allPages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            mergeNodes();
        });

        function mergeNodes() {
            nodes = [
                ...oldCategories.map(c => ({ id: c.id, title: c.name, icon: c.icon || '', parentId: c.parentId || null, isLegacyCategory: true })),
                ...allPages.map(p => ({ ...p, icon: p.icon || '', parentId: p.parentId || p.categoryId || null }))
            ];
            
            renderNav();
            
            if (activePath.length === 0) {
                renderWelcomeScreen();
            } else {
                const lastId = activePath[activePath.length - 1];
                if (!nodes.find(n => n.id === lastId)) goHome();
                else loadArticles();
            }
        }

        window.goHome = () => {
            activePath = [];
            renderNav();
            renderWelcomeScreen();
            clearArticleListeners();
        };

        function renderWelcomeScreen() {
            contentDisplay.innerHTML = `
                <div class="welcome-screen">
                    <h1 style="color:var(--primary-accent); margin-bottom:1rem; font-size: 2.5rem;">Welcome to Omi</h1>
                    <p style="color:var(--text-muted); font-size: 1.1rem; line-height:1.8; max-width:600px; margin:0 auto;">
                        Select any section from the list above to start, or browse freely!
                    </p>
                </div>
            `;
            document.getElementById('addArticleBtn').style.display = 'none';
        }

        // --- DYNAMIC HIERARCHICAL NAVIGATION ---
        function renderNav() {
            navContainer.innerHTML = '';
            let currentParentId = null;

            for (let i = 0; i <= activePath.length; i++) {
                const rowNodes = nodes.filter(n => n.parentId === currentParentId);
                
                if (rowNodes.length > 0) {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'horizontal-scroll ' + (i > 0 ? 'pages-bar' : '');
                    
                    rowNodes.forEach(node => {
                        const btn = document.createElement('div');
                        const isActive = activePath[i] === node.id;
                        btn.className = `category-item ${isActive ? 'active' : ''}`;
                        
                        let adminActionsHtml = '';
                        if (userRole === 'admin') {
                            adminActionsHtml = `
                                <span class="node-admin-actions" id="actions-${node.id}">
                                    <span class="node-admin-btn" onclick="event.stopPropagation(); openEmojiPicker('${node.id}')">😀</span>
                                    <span class="node-admin-btn" onclick="event.stopPropagation(); openMoveNodeModal('${node.id}')">🚚</span>
                                    <span class="node-admin-btn" onclick="event.stopPropagation(); editNode('${node.id}')">✏️</span>
                                    <span class="node-admin-btn" onclick="event.stopPropagation(); deleteNode('${node.id}')">🗑️</span>
                                </span>`;
                        }

                        const emojiDisplay = node.icon ? `<span class="category-icon">${node.icon}</span> ` : '';
                        btn.innerHTML = `${emojiDisplay}<span>${node.title}</span> ${adminActionsHtml}`;
                        
                        // Click and Double-Click Handler with a 1.5-second window
                        if (userRole === 'admin') {
                            let clickTimer = null;
                            btn.onclick = (e) => {
                                if (e.target.closest('.node-admin-actions')) return;
                                
                                if (clickTimer === null) {
                                    clickTimer = setTimeout(() => {
                                        clickTimer = null;
                                        selectNode(node.id, i);
                                    }, 1500);
                                } else {
                                    clearTimeout(clickTimer);
                                    clickTimer = null;
                                    const actionSpan = btn.querySelector('.node-admin-actions');
                                    if (actionSpan) actionSpan.classList.toggle('visible');
                                }
                            };
                        } else {
                            btn.onclick = () => selectNode(node.id, i);
                        }

                        rowDiv.appendChild(btn);
                    });
                    navContainer.appendChild(rowDiv);
                }

                if (i < activePath.length) {
                    currentParentId = activePath[i];
                } else {
                    break;
                }
            }
            
            if(activePath.length > 0 && userRole === 'admin') {
                document.getElementById('addArticleBtn').style.display = 'inline-flex';
            } else {
                document.getElementById('addArticleBtn').style.display = 'none';
            }
        }

        function selectNode(nodeId, depthIndex) {
            activePath = activePath.slice(0, depthIndex);
            activePath.push(nodeId);
            renderNav();
            loadArticles();
        }

        function clearArticleListeners() {
            if (articlesUnsubscribe) articlesUnsubscribe();
            commentsUnsubscribers.forEach(unsub => unsub());
            commentsUnsubscribers = [];
        }

        // --- ARTICLES SYSTEM ---
        function loadArticles() {
            const activeNodeId = activePath[activePath.length - 1];
            const activeNode = nodes.find(n => n.id === activeNodeId);
            if (!activeNode) return;

            clearArticleListeners();
            contentDisplay.innerHTML = '';

            // 1. Render Legacy Content
            if (activeNode.content) {
                renderArticleCard(activeNode, activeNodeId, true, contentDisplay);
            }

            const newArticlesContainer = document.createElement('div');
            contentDisplay.appendChild(newArticlesContainer);

            // 2. Fetch New Articles from subcollection
            const articlesQ = query(collection(db, "pages", activeNodeId, "articles"), orderBy("createdAt", "desc"));
            
            articlesUnsubscribe = onSnapshot(articlesQ, (snapshot) => {
                newArticlesContainer.innerHTML = '';
                if (snapshot.empty && !activeNode.content) {
                    newArticlesContainer.innerHTML = `<div style="text-align:center; padding: 4rem 1rem; color:var(--text-muted);">No articles in this section yet.</div>`;
                    return;
                }

                snapshot.forEach(docSnap => {
                    const article = { id: docSnap.id, ...docSnap.data() };
                    renderArticleCard(article, activeNodeId, false, newArticlesContainer);
                });
            });
        }

        function renderArticleCard(article, pageId, isLegacy, targetContainer) {
            const isLiked = article.likedBy?.includes(currentUser?.uid);
            const isDisliked = article.dislikedBy?.includes(currentUser?.uid);

            const container = document.createElement('div');
            container.className = 'article-container';
            
            let adminActions = '';
            if (userRole === 'admin') {
                adminActions = `
                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                        <button class="btn btn-outline" style="padding:0.3rem 0.6rem;" onclick="openMoveModal('${article.id}', ${isLegacy})">Move</button>
                        <button class="btn btn-outline" style="padding:0.3rem 0.6rem;" onclick="editArticle('${article.id}', ${isLegacy})">Edit</button>
                        <button class="btn btn-danger" style="padding:0.3rem 0.6rem;" onclick="deleteArticle('${article.id}', ${isLegacy})">Delete</button>
                    </div>`;
            }

            container.innerHTML = `
                <div class="content-card">
                    ${article.imageUrl ? `<img src="${article.imageUrl}" class="page-hero-img" alt="${article.title}">` : ''}
                    <div class="page-body">
                        <div class="page-title">
                            <span>${article.title}</span>
                            ${adminActions}
                        </div>
                        <div class="page-text">${article.content}</div>
                        
                        <div class="interaction-bar">
                            <div class="vote-buttons">
                                <button class="vote-btn ${isLiked ? 'liked' : ''}" onclick="handleVote('like', '${article.id}', '${pageId}', ${isLegacy})">
                                    👍 <span>${article.likedBy?.length || 0}</span>
                                </button>
                                <button class="vote-btn ${isDisliked ? 'disliked' : ''}" onclick="handleVote('dislike', '${article.id}', '${pageId}', ${isLegacy})">
                                    👎 <span>${article.dislikedBy?.length || 0}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="comments-section">
                    <h4 class="comments-title">Comments</h4>
                    <div class="comment-form">
                        <textarea id="commentInput_${article.id}" rows="2" placeholder="Add a comment..."></textarea>
                        <button class="btn btn-primary" style="align-self: flex-end;" onclick="postComment('${article.id}', '${pageId}', ${isLegacy})">Post Comment</button>
                    </div>
                    <div class="comments-list" id="commentsList_${article.id}">
                        <div style="color:var(--text-muted); font-size:0.9rem;">Loading comments...</div>
                    </div>
                </div>
            `;
            
            targetContainer.appendChild(container);

            const commentsRef = isLegacy 
                ? collection(db, "pages", article.id, "comments")
                : collection(db, "pages", pageId, "articles", article.id, "comments");

            const commentsQ = query(commentsRef, orderBy("createdAt", "desc"));
            const unsub = onSnapshot(commentsQ, (snap) => {
                const listDiv = document.getElementById(`commentsList_${article.id}`);
                if (!listDiv) return;
                listDiv.innerHTML = '';
                if (snap.empty) {
                    listDiv.innerHTML = `<div style="color:var(--text-muted); font-size:0.9rem;">No comments yet.</div>`;
                    return;
                }
                snap.forEach(cSnap => {
                    const c = cSnap.data();
                    const commentId = cSnap.id;
                    const isAuthorOrAdmin = currentUser && (currentUser.uid === c.authorUid || userRole === 'admin');

                    const card = document.createElement('div');
                    card.className = 'comment-card';
                    card.id = `comment_card_${commentId}`;

                    let commentActionsHtml = '';
                    if (isAuthorOrAdmin) {
                        const escapedText = (c.text || '').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/'/g, "\\'");
                        commentActionsHtml = `
                            <div class="comment-actions">
                                <button class="comment-btn-sm" onclick="editComment('${commentId}', '${article.id}', '${pageId}', ${isLegacy}, '${escapedText}')" title="Edit">✏️</button>
                                <button class="comment-btn-sm" onclick="deleteComment('${commentId}', '${article.id}', '${pageId}', ${isLegacy})" title="Delete">🗑️</button>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="comment-header">
                            <span class="comment-author">${c.authorName || 'Anonymous'}</span>
                            <div style="display:flex; align-items:center; gap:0.75rem;">
                                <span>${c.createdAt ? new Date(c.createdAt.toDate()).toLocaleString() : 'Just now'}</span>
                                ${commentActionsHtml}
                            </div>
                        </div>
                        <div id="comment_text_${commentId}">${c.text}</div>
                    `;
                    listDiv.appendChild(card);
                });
            });
            commentsUnsubscribers.push(unsub);
        }

        // --- VOTES & COMMENTS SYSTEM ---
        window.handleVote = async (type, articleId, pageId, isLegacy) => {
            if (!currentUser) return alert("Please sign in to vote.");
            const articleRef = isLegacy ? doc(db, "pages", articleId) : doc(db, "pages", pageId, "articles", articleId);
            const uid = currentUser.uid;
            const articleSnap = await getDoc(articleRef);
            if(!articleSnap.exists()) return;
            const data = articleSnap.data();
            const likedBy = data.likedBy || [];
            const dislikedBy = data.dislikedBy || [];
            if (type === 'like') {
                if (likedBy.includes(uid)) await updateDoc(articleRef, { likedBy: arrayRemove(uid) });
                else await updateDoc(articleRef, { likedBy: arrayUnion(uid), dislikedBy: arrayRemove(uid) });
            } else {
                if (dislikedBy.includes(uid)) await updateDoc(articleRef, { dislikedBy: arrayRemove(uid) });
                else await updateDoc(articleRef, { dislikedBy: arrayUnion(uid), likedBy: arrayRemove(uid) });
            }
        };

        window.postComment = async (articleId, pageId, isLegacy) => {
            if (!currentUser) return alert("Please sign in to comment.");
            const input = document.getElementById(`commentInput_${articleId}`);
            const text = input.value.trim();
            if (!text) return;
            const commentsRef = isLegacy ? collection(db, "pages", articleId, "comments") : collection(db, "pages", pageId, "articles", articleId, "comments");
            await addDoc(commentsRef, { text, authorName: currentUser.displayName, authorUid: currentUser.uid, createdAt: serverTimestamp() });
            input.value = '';
        };

        window.deleteComment = async (commentId, articleId, pageId, isLegacy) => {
            if (!confirm("Are you sure you want to delete this comment?")) return;
            const commentRef = isLegacy 
                ? doc(db, "pages", articleId, "comments", commentId) 
                : doc(db, "pages", pageId, "articles", articleId, "comments", commentId);
            await deleteDoc(commentRef);
        };

        window.editComment = (commentId, articleId, pageId, isLegacy, currentText) => {
            const textDiv = document.getElementById(`comment_text_${commentId}`);
            if (!textDiv) return;

            const escapedOriginal = currentText.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/'/g, "\\'");
            
            textDiv.innerHTML = `
                <div style="margin-top:0.5rem; display:flex; flex-direction:column; gap:0.5rem;">
                    <textarea id="edit_input_${commentId}" rows="2">${currentText}</textarea>
                    <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
                        <button class="btn btn-outline" style="padding:0.25rem 0.6rem; font-size:0.8rem;" onclick="cancelEditComment('${commentId}', '${escapedOriginal}')">Cancel</button>
                        <button class="btn btn-primary" style="padding:0.25rem 0.6rem; font-size:0.8rem;" onclick="saveCommentEdit('${commentId}', '${articleId}', '${pageId}', ${isLegacy})">Save</button>
                    </div>
                </div>
            `;
        };

        window.cancelEditComment = (commentId, originalText) => {
            const textDiv = document.getElementById(`comment_text_${commentId}`);
            if (textDiv) textDiv.innerText = originalText;
        };

        window.saveCommentEdit = async (commentId, articleId, pageId, isLegacy) => {
            const input = document.getElementById(`edit_input_${commentId}`);
            if (!input) return;
            const newText = input.value.trim();
            if (!newText) return alert("Comment cannot be empty.");

            const commentRef = isLegacy 
                ? doc(db, "pages", articleId, "comments", commentId) 
                : doc(db, "pages", pageId, "articles", articleId, "comments", commentId);

            await updateDoc(commentRef, { text: newText });
        };

        // --- MULTI-EMOJI PICKER (MAX 5) ---
        window.openEmojiPicker = (id) => {
            nodeForEmoji = nodes.find(n => n.id === id);
            if (!nodeForEmoji) return;
            
            selectedEmojis = nodeForEmoji.icon ? Array.from(nodeForEmoji.icon) : [];
            updateEmojiPreview();
            document.getElementById('emojiModal').style.display = 'flex';
        };

        window.toggleEmoji = (emojiChar) => {
            if (selectedEmojis.length >= 5) {
                alert("Maximum 5 icons allowed.");
                return;
            }
            selectedEmojis.push(emojiChar);
            updateEmojiPreview();
        };

        window.clearSelectedEmojis = () => {
            selectedEmojis = [];
            updateEmojiPreview();
        };

        function updateEmojiPreview() {
            const previewDiv = document.getElementById('emojiPreview');
            if (previewDiv) {
                if (selectedEmojis.length === 0) {
                    previewDiv.innerHTML = `<span style="color:var(--text-muted); font-size:0.9rem;">No icon selected</span>`;
                } else {
                    previewDiv.innerHTML = selectedEmojis.map((e, idx) => `
                        <span style="cursor:pointer;" onclick="removeEmojiAtIndex(${idx})" title="Click to remove">${e}</span>
                    `).join('');
                }
            }
        }

        window.removeEmojiAtIndex = (index) => {
            selectedEmojis.splice(index, 1);
            updateEmojiPreview();
        };

        window.confirmEmojiSelection = async () => {
            if (!nodeForEmoji) return;
            const emojiString = selectedEmojis.join('');
            const ref = nodeForEmoji.isLegacyCategory ? doc(db, "categories", nodeForEmoji.id) : doc(db, "pages", nodeForEmoji.id);
            await updateDoc(ref, { icon: emojiString });
            closeModals();
        };

        // --- ADMIN CRUD: SECTION NODES & DIRECTORY MOVE ---
        document.getElementById('addCategoryBtn').onclick = () => {
            editingNodeId = null;
            nodeParentTarget = null;
            if (activePath.length > 0) {
                const activeId = activePath[activePath.length - 1];
                const activeNode = nodes.find(n => n.id === activeId);
                if (activeNode) nodeParentTarget = activeNode.parentId;
            }
            document.getElementById('nodeModalTitle').innerText = "Add New Category (Sibling)";
            document.getElementById('nodeTitleInput').value = "";
            document.getElementById('nodeModal').style.display = "flex";
        };

        document.getElementById('addPageBtn').onclick = () => {
            editingNodeId = null;
            nodeParentTarget = activePath.length > 0 ? activePath[activePath.length - 1] : null;
            document.getElementById('nodeModalTitle').innerText = "Add New Page (Child)";
            document.getElementById('nodeTitleInput').value = "";
            document.getElementById('nodeModal').style.display = "flex";
        };

        window.editNode = (id) => {
            const node = nodes.find(n => n.id === id);
            if (!node) return;
            editingNodeId = id;
            document.getElementById('nodeModalTitle').innerText = "Edit Item";
            document.getElementById('nodeTitleInput').value = node.title;
            document.getElementById('nodeModal').style.display = "flex";
        };

        window.deleteNode = async (id) => {
            if (confirm("Delete this section and everything inside it?")) {
                const node = nodes.find(n => n.id === id);
                if(node.isLegacyCategory) await deleteDoc(doc(db, "categories", id));
                else await deleteDoc(doc(db, "pages", id));
                if (activePath.includes(id)) goHome();
            }
        };

        document.getElementById('saveNodeBtn').onclick = async () => {
            const title = document.getElementById('nodeTitleInput').value.trim();
            if (!title) return;
            if (editingNodeId) {
                const node = nodes.find(n => n.id === editingNodeId);
                const ref = node.isLegacyCategory ? doc(db, "categories", editingNodeId) : doc(db, "pages", editingNodeId);
                const updateData = node.isLegacyCategory ? { name: title } : { title: title };
                await updateDoc(ref, updateData);
            } else {
                await addDoc(collection(db, "pages"), { title, icon: '', parentId: nodeParentTarget, createdAt: serverTimestamp() });
            }
            closeModals();
        };

        // --- DIRECTORY-LIKE MOVE FOR SECTION NODES ---
        function getDescendantNodeIds(startNodeId) {
            const descendants = new Set();
            const queue = [startNodeId];
            while (queue.length > 0) {
                const currentId = queue.shift();
                nodes.filter(n => n.parentId === currentId).forEach(child => {
                    descendants.add(child.id);
                    queue.push(child.id);
                });
            }
            return descendants;
        }

        window.openMoveNodeModal = (nodeId) => {
            nodeToMoveId = nodeId;
            const targetNode = nodes.find(n => n.id === nodeId);
            if (!targetNode) return;

            const forbiddenIds = getDescendantNodeIds(nodeId);
            forbiddenIds.add(nodeId);

            const select = document.getElementById('nodeMoveDestinationSelect');
            select.innerHTML = '<option value="root">-- Top Level (Root Category) --</option>';

            nodes.forEach(n => {
                if (!forbiddenIds.has(n.id)) {
                    const opt = document.createElement('option');
                    opt.value = n.id;
                    opt.text = n.title || n.name;
                    if (n.id === targetNode.parentId) opt.selected = true;
                    select.appendChild(opt);
                }
            });

            document.getElementById('nodeMoveModal').style.display = 'flex';
        };

        document.getElementById('confirmNodeMoveBtn').onclick = async () => {
            if (!nodeToMoveId) return;
            const selectedVal = document.getElementById('nodeMoveDestinationSelect').value;
            const newParentId = selectedVal === 'root' ? null : selectedVal;

            const targetNode = nodes.find(n => n.id === nodeToMoveId);
            if (!targetNode) return;

            if (targetNode.parentId === newParentId) {
                closeModals();
                return;
            }

            try {
                const ref = targetNode.isLegacyCategory ? doc(db, "categories", nodeToMoveId) : doc(db, "pages", nodeToMoveId);
                await updateDoc(ref, { parentId: newParentId });
                closeModals();
            } catch (err) {
                console.error("Error moving section node:", err);
                alert("Failed to move section.");
            }
        };

        // --- ADMIN CRUD: ARTICLES ---
        document.getElementById('addArticleBtn').onclick = () => {
            if (activePath.length === 0) return;
            editingArticleId = null;
            isEditingLegacyArticle = false;
            document.getElementById('articleModalTitle').innerText = "Add New Article";
            document.getElementById('articleTitleInput').value = "";
            document.getElementById('articleImageInput').value = "";
            document.getElementById('articleContentInput').value = "";
            document.getElementById('articleModal').style.display = "flex";
        };

        window.editArticle = async (id, isLegacy) => {
            isEditingLegacyArticle = isLegacy;
            editingArticleId = id;
            let articleRef = isLegacy ? doc(db, "pages", id) : doc(db, "pages", activePath[activePath.length - 1], "articles", id);
            const docSnap = await getDoc(articleRef);
            if(!docSnap.exists()) return;
            const article = docSnap.data();
            document.getElementById('articleModalTitle').innerText = "Edit Article";
            document.getElementById('articleTitleInput').value = article.title;
            document.getElementById('articleImageInput').value = article.imageUrl || "";
            document.getElementById('articleContentInput').value = article.content;
            document.getElementById('articleModal').style.display = "flex";
        };

        window.deleteArticle = async (id, isLegacy) => {
            if (confirm("Delete this article?")) {
                if(isLegacy) {
                    await deleteDoc(doc(db, "pages", id));
                    if (activePath.includes(id)) goHome();
                } else {
                    await deleteDoc(doc(db, "pages", activePath[activePath.length - 1], "articles", id));
                }
            }
        };

        document.getElementById('saveArticleBtn').onclick = async () => {
            const activeNodeId = activePath[activePath.length - 1];
            if (!activeNodeId && !isEditingLegacyArticle) return;
            const title = document.getElementById('articleTitleInput').value.trim();
            const imageUrl = document.getElementById('articleImageInput').value.trim();
            const content = document.getElementById('articleContentInput').value.trim();
            if (!title || !content) return alert("Title and Content are required.");

            if (editingArticleId) {
                const articleRef = isEditingLegacyArticle ? doc(db, "pages", editingArticleId) : doc(db, "pages", activeNodeId, "articles", editingArticleId);
                await updateDoc(articleRef, { title, imageUrl, content });
            } else {
                await addDoc(collection(db, "pages", activeNodeId, "articles"), { title, imageUrl, content, likedBy: [], dislikedBy: [], createdAt: serverTimestamp() });
            }
            closeModals();
        };

        // --- MOVE ARTICLE FEATURE ---
        window.openMoveModal = (articleId, isLegacy) => {
            articleToMoveId = articleId;
            articleToMoveIsLegacy = isLegacy;
            articleToMoveSourceId = activePath[activePath.length - 1];

            const select = document.getElementById('moveDestinationSelect');
            select.innerHTML = '<option value="">-- Choose Target Section --</option>';
            
            nodes.forEach(node => {
                const opt = document.createElement('option');
                opt.value = node.id;
                opt.text = node.title || node.name;
                select.appendChild(opt);
            });

            document.getElementById('moveModal').style.display = 'flex';
        };

        document.getElementById('confirmMoveBtn').onclick = async () => {
            const targetNodeId = document.getElementById('moveDestinationSelect').value;
            if(!targetNodeId) return alert("Please select a destination.");
            
            if(targetNodeId === articleToMoveSourceId && !articleToMoveIsLegacy) {
                alert("Article is already inside this section.");
                return;
            }

            try {
                if(articleToMoveIsLegacy) {
                    const ref = doc(db, "pages", articleToMoveId);
                    await updateDoc(ref, { parentId: targetNodeId });
                } else {
                    const oldRef = doc(db, "pages", articleToMoveSourceId, "articles", articleToMoveId);
                    const newRef = doc(db, "pages", targetNodeId, "articles", articleToMoveId);
                    
                    const docSnap = await getDoc(oldRef);
                    if(docSnap.exists()) {
                        await setDoc(newRef, docSnap.data());
                        
                        const oldCommentsRef = collection(db, "pages", articleToMoveSourceId, "articles", articleToMoveId, "comments");
                        const newCommentsRef = collection(db, "pages", targetNodeId, "articles", articleToMoveId, "comments");
                        const commentsSnap = await getDocs(oldCommentsRef);
                        
                        const transferPromises = [];
                        commentsSnap.forEach(cSnap => {
                            transferPromises.push(setDoc(doc(newCommentsRef, cSnap.id), cSnap.data()));
                            transferPromises.push(deleteDoc(doc(oldCommentsRef, cSnap.id)));
                        });
                        
                        await Promise.all(transferPromises);
                        await deleteDoc(oldRef);
                    }
                }
                
                closeModals();
                if(activePath[activePath.length - 1] === articleToMoveSourceId) {
                    loadArticles();
                }
            } catch (error) {
                console.error("Error moving article:", error);
                alert("Failed to move the article.");
            }
        };

    </script>
</body>
</html>
