<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intrinsic — True Motivation Academy</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f17;
            --surface-color: #161f2e;
            --surface-hover: #1f2c40;
            --border-color: #2a3a52;
            --primary-accent: #f59e0b; /* Flame Amber */
            --primary-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --like-color: #10b981;
            --dislike-color: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-accent), #f97316);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 800;
            color: #000;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Navigation Systems */
        .nav-container {
            background-color: rgba(22, 31, 46, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 65px;
            z-index: 90;
        }

        .horizontal-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.75rem 2rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .horizontal-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .category-item, .page-item {
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .category-item:hover, .page-item:hover {
            border-color: var(--primary-accent);
            color: var(--text-main);
        }

        .category-item.active {
            background-color: var(--primary-accent);
            color: #000;
            border-color: var(--primary-accent);
        }

        .pages-bar {
            background-color: rgba(11, 15, 23, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .page-item.active {
            background-color: var(--surface-hover);
            color: var(--primary-accent);
            border-color: var(--primary-accent);
        }

        /* Buttons & Forms */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary-accent);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: var(--surface-hover);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #fff;
        }

        /* Main Content */
        main {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex-grow: 1;
        }

        .content-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .page-hero-img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .page-body {
            padding: 2rem;
        }

        .page-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .page-text {
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 1.05rem;
            white-space: pre-line;
            margin-bottom: 2rem;
        }

        /* Interaction Bar */
        .interaction-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .vote-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .vote-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .vote-btn.liked {
            border-color: var(--like-color);
            color: var(--like-color);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .vote-btn.disliked {
            border-color: var(--dislike-color);
            color: var(--dislike-color);
            background-color: rgba(244, 63, 94, 0.1);
        }

        /* Comments Section */
        .comments-section {
            margin-top: 2rem;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
        }

        .comments-title {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        textarea, input[type="text"], input[type="url"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input:focus {
            border-color: var(--primary-accent);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .comment-author {
            font-weight: 700;
            color: var(--primary-accent);
        }

        /* Admin Controls Toolbar */
        .admin-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--primary-accent);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            align-items: center;
            justify-content: space-between;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 550px;
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-logo">M</div>
            <div>
                <div class="brand-title">DRIVE</div>
                <div class="brand-subtitle">True Motivation School</div>
            </div>
        </div>
        <div class="user-controls">
            <span id="roleBadge" class="hidden" style="font-size:0.75rem; background:var(--primary-accent); color:#000; font-weight:800; padding:2px 8px; border-radius:4px;">ADMIN</span>
            <button id="authBtn" class="btn btn-outline">Sign In with Gmail</button>
        </div>
    </header>

    <!-- Horizontal Categories & Pages Nav -->
    <div class="nav-container">
        <!-- Categories Horizontal Scroll -->
        <div class="horizontal-scroll" id="categoriesContainer">
            <!-- Categories rendered dynamically -->
        </div>

        <!-- Pages Horizontal Scroll -->
        <div class="horizontal-scroll pages-bar" id="pagesContainer">
            <!-- Pages rendered dynamically -->
        </div>
    </div>

    <!-- Main Content Area -->
    <main>
        <!-- Admin Management Panel (Only visible for Admin role) -->
        <div id="adminPanel" class="admin-controls hidden">
            <span style="font-weight:700; font-size:0.9rem;">⚡ Admin Command Bar</span>
            <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-primary" id="addCategoryBtn">+ New Category</button>
                <button class="btn btn-primary" id="addPageBtn">+ New Page</button>
            </div>
        </div>

        <!-- Dynamic Content Card -->
        <div id="contentDisplay">
            <div style="text-align:center; padding: 4rem 1rem; color:var(--text-muted);">
                Select a category and page above to start exploring true intrinsic motivation.
            </div>
        </div>

        <!-- Comments Section -->
        <section id="commentsSection" class="comments-section hidden">
            <h3 class="comments-title">Discussion & Insights</h3>
            
            <div class="comment-form">
                <textarea id="commentInput" rows="3" placeholder="Share your intrinsic perspective... (Requires Sign-In)"></textarea>
                <button id="submitCommentBtn" class="btn btn-primary" style="align-self: flex-end;">Post Comment</button>
            </div>

            <div class="comments-list" id="commentsList">
                <!-- Comments rendered dynamically -->
            </div>
        </section>
    </main>

    <!-- Modal for Category Create/Edit -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <h3 id="categoryModalTitle">Add Category</h3>
            <input type="text" id="categoryNameInput" placeholder="Category Name (e.g. Autonomy & Mastery)">
            <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
                <button class="btn btn-outline" id="closeCatModal">Cancel</button>
                <button class="btn btn-primary" id="saveCatBtn">Save Category</button>
            </div>
        </div>
    </div>

    <!-- Modal for Page Create/Edit -->
    <div class="modal" id="pageModal">
        <div class="modal-content">
            <h3 id="pageModalTitle">Add Page</h3>
            <input type="text" id="pageTitleInput" placeholder="Page Title">
            <input type="url" id="pageImageInput" placeholder="Image URL (Direct link ending in .jpg, .png...)">
            <textarea id="pageContentInput" rows="6" placeholder="Write page content here... Explain why internal drive beats discipline."></textarea>
            <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
                <button class="btn btn-outline" id="closePageModal">Cancel</button>
                <button class="btn btn-primary" id="savePageBtn">Save Page</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase Configuration (Extracted from your screenshot)
        const firebaseConfig = {
            apiKey: "AIzaSyAKTU5AWs20Ep7_23HCz6hqXqaASn_SZz4",
            authDomain: "our-school-585fd.firebaseapp.com",
            projectId: "our-school-585fd",
            storageBucket: "our-school-585fd.firebasestorage.app",
            messagingSenderId: "1058799296440",
            appId: "1:1058799296440:web:4018915145043ddf10b94d",
            measurementId: "G-FGM87QJBC7"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Application State
        let currentUser = null;
        let userRole = 'user'; // 'user' or 'admin'
        let categories = [];
        let pages = [];
        let activeCategoryId = null;
        let activePageId = null;

        // DOM Elements
        const authBtn = document.getElementById('authBtn');
        const roleBadge = document.getElementById('roleBadge');
        const adminPanel = document.getElementById('adminPanel');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const pagesContainer = document.getElementById('pagesContainer');
        const contentDisplay = document.getElementById('contentDisplay');
        const commentsSection = document.getElementById('commentsSection');
        const commentsList = document.getElementById('commentsList');
        const commentInput = document.getElementById('commentInput');
        const submitCommentBtn = document.getElementById('submitCommentBtn');

        // Modals
        const categoryModal = document.getElementById('categoryModal');
        const pageModal = document.getElementById('pageModal');
        let editingCatId = null;
        let editingPageId = null;

        // --- AUTHENTICATION ---
        authBtn.addEventListener('click', () => {
            if (currentUser) {
                signOut(auth);
            } else {
                signInWithPopup(auth, provider);
            }
        });

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                authBtn.innerText = "Sign Out (" + user.displayName.split(' ')[0] + ")";
                // Fetch User Role from Firestore 'users' collection
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    userRole = userSnap.data().role || 'user';
                } else {
                    // Create default user document
                    await setDoc(userRef, { email: user.email, role: 'user' });
                    userRole = 'user';
                }
            } else {
                currentUser = null;
                userRole = 'user';
                authBtn.innerText = "Sign In with Gmail";
            }

            updateRoleUI();
            if (activePageId) renderPageContent();
        });

        function updateRoleUI() {
            if (userRole === 'admin') {
                roleBadge.classList.remove('hidden');
                adminPanel.classList.remove('hidden');
            } else {
                roleBadge.classList.add('hidden');
                adminPanel.classList.add('hidden');
            }
            renderCategoriesNav();
            renderPagesNav();
        }

        // --- FIRESTORE REALTIME LISTENERS ---
        // Fetch Categories
        onSnapshot(collection(db, "categories"), (snapshot) => {
            categories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderCategoriesNav();
            if (!activeCategoryId && categories.length > 0) {
                selectCategory(categories[0].id);
            }
        });

        // Fetch Pages
        onSnapshot(collection(db, "pages"), (snapshot) => {
            pages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderPagesNav();
            if (activePageId) renderPageContent();
        });

        // --- RENDER FUNCTIONS ---
        function renderCategoriesNav() {
            categoriesContainer.innerHTML = '';
            
            categories.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = `category-item ${cat.id === activeCategoryId ? 'active' : ''}`;
                
                let adminActions = '';
                if (userRole === 'admin') {
                    adminActions = ` <span style="margin-left:5px; opacity:0.6;" onclick="event.stopPropagation(); editCategory('${cat.id}', '${cat.name}')">✏️</span>
                                     <span style="opacity:0.6;" onclick="event.stopPropagation(); deleteCategory('${cat.id}')">🗑️</span>`;
                }

                btn.innerHTML = `${cat.name} ${adminActions}`;
                btn.onclick = () => selectCategory(cat.id);
                categoriesContainer.appendChild(btn);
            });
        }

        function selectCategory(catId) {
            activeCategoryId = catId;
            renderCategoriesNav();
            
            // Filter pages for this category
            const catPages = pages.filter(p => p.categoryId === catId);
            if (catPages.length > 0) {
                selectPage(catPages[0].id);
            } else {
                activePageId = null;
                renderPagesNav();
                contentDisplay.innerHTML = `<div style="text-align:center; padding: 4rem 1rem; color:var(--text-muted);">No pages in this category yet.</div>`;
                commentsSection.classList.add('hidden');
            }
        }

        function renderPagesNav() {
            pagesContainer.innerHTML = '';
            const filteredPages = pages.filter(p => p.categoryId === activeCategoryId);

            filteredPages.forEach(page => {
                const btn = document.createElement('div');
                btn.className = `page-item ${page.id === activePageId ? 'active' : ''}`;
                
                let adminActions = '';
                if (userRole === 'admin') {
                    adminActions = ` <span style="margin-left:5px; opacity:0.6;" onclick="event.stopPropagation(); editPage('${page.id}')">✏️</span>
                                     <span style="opacity:0.6;" onclick="event.stopPropagation(); deletePage('${page.id}')">🗑️</span>`;
                }

                btn.innerHTML = `${page.title} ${adminActions}`;
                btn.onclick = () => selectPage(page.id);
                pagesContainer.appendChild(btn);
            });
        }

        function selectPage(pageId) {
            activePageId = pageId;
            renderPagesNav();
            renderPageContent();
            loadComments(pageId);
        }

        function renderPageContent() {
            const page = pages.find(p => p.id === activePageId);
            if (!page) return;

            const isLiked = page.likedBy?.includes(currentUser?.uid);
            const isDisliked = page.dislikedBy?.includes(currentUser?.uid);

            contentDisplay.innerHTML = `
                <div class="content-card">
                    ${page.imageUrl ? `<img src="${page.imageUrl}" class="page-hero-img" alt="${page.title}">` : ''}
                    <div class="page-body">
                        <h1 class="page-title">${page.title}</h1>
                        <div class="page-text">${page.content}</div>
                        
                        <div class="interaction-bar">
                            <div class="vote-buttons">
                                <button class="vote-btn ${isLiked ? 'liked' : ''}" id="likeBtn">
                                    👍 <span>${page.likedBy?.length || 0}</span>
                                </button>
                                <button class="vote-btn ${isDisliked ? 'disliked' : ''}" id="dislikeBtn">
                                    👎 <span>${page.dislikedBy?.length || 0}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            commentsSection.classList.remove('hidden');

            document.getElementById('likeBtn').onclick = () => handleVote('like', page);
            document.getElementById('dislikeBtn').onclick = () => handleVote('dislike', page);
        }

        // --- VOTING SYSTEM ---
        async function handleVote(type, page) {
            if (!currentUser) {
                alert("Please sign in with Gmail to like or dislike.");
                return;
            }

            const pageRef = doc(db, "pages", page.id);
            const uid = currentUser.uid;
            const likedBy = page.likedBy || [];
            const dislikedBy = page.dislikedBy || [];

            if (type === 'like') {
                if (likedBy.includes(uid)) {
                    await updateDoc(pageRef, { likedBy: arrayRemove(uid) });
                } else {
                    await updateDoc(pageRef, { 
                        likedBy: arrayUnion(uid),
                        dislikedBy: arrayRemove(uid)
                    });
                }
            } else {
                if (dislikedBy.includes(uid)) {
                    await updateDoc(pageRef, { dislikedBy: arrayRemove(uid) });
                } else {
                    await updateDoc(pageRef, { 
                        dislikedBy: arrayUnion(uid),
                        likedBy: arrayRemove(uid)
                    });
                }
            }
        }

        // --- COMMENTS SYSTEM ---
        function loadComments(pageId) {
            const commentsQ = query(collection(db, "pages", pageId, "comments"), orderBy("createdAt", "desc"));
            onSnapshot(commentsQ, (snapshot) => {
                commentsList.innerHTML = '';
                if (snapshot.empty) {
                    commentsList.innerHTML = `<div style="color:var(--text-muted); font-size:0.9rem;">No comments yet. Start the conversation!</div>`;
                    return;
                }
                snapshot.forEach(docSnap => {
                    const c = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'comment-card';
                    card.innerHTML = `
                        <div class="comment-header">
                            <span class="comment-author">${c.authorName}</span>
                            <span>${c.createdAt ? new Date(c.createdAt.toDate()).toLocaleString() : 'Just now'}</span>
                        </div>
                        <div>${c.text}</div>
                    `;
                    commentsList.appendChild(card);
                });
            });
        }

        submitCommentBtn.onclick = async () => {
            if (!currentUser) return alert("Please sign in to comment.");
            const text = commentInput.value.trim();
            if (!text || !activePageId) return;

            await addDoc(collection(db, "pages", activePageId, "comments"), {
                text: text,
                authorName: currentUser.displayName,
                authorUid: currentUser.uid,
                createdAt: serverTimestamp()
            });

            commentInput.value = '';
        };

        // --- ADMIN CRUD ACTIONS ---
        // Category Modals & CRUD
        document.getElementById('addCategoryBtn').onclick = () => {
            editingCatId = null;
            document.getElementById('categoryModalTitle').innerText = "Add Category";
            document.getElementById('categoryNameInput').value = "";
            categoryModal.style.display = "flex";
        };

        window.editCategory = (id, name) => {
            editingCatId = id;
            document.getElementById('categoryModalTitle').innerText = "Edit Category";
            document.getElementById('categoryNameInput').value = name;
            categoryModal.style.display = "flex";
        };

        window.deleteCategory = async (id) => {
            if (confirm("Delete category and all associated views?")) {
                await deleteDoc(doc(db, "categories", id));
                if (activeCategoryId === id) activeCategoryId = null;
            }
        };

        document.getElementById('saveCatBtn').onclick = async () => {
            const name = document.getElementById('categoryNameInput').value.trim();
            if (!name) return;

            if (editingCatId) {
                await updateDoc(doc(db, "categories", editingCatId), { name });
            } else {
                await addDoc(collection(db, "categories"), { name, createdAt: serverTimestamp() });
            }
            categoryModal.style.display = "none";
        };

        // Page Modals & CRUD
        document.getElementById('addPageBtn').onclick = () => {
            if (!activeCategoryId) return alert("Please create/select a category first.");
            editingPageId = null;
            document.getElementById('pageModalTitle').innerText = "Add Page";
            document.getElementById('pageTitleInput').value = "";
            document.getElementById('pageImageInput').value = "";
            document.getElementById('pageContentInput').value = "";
            pageModal.style.display = "flex";
        };

        window.editPage = (id) => {
            const page = pages.find(p => p.id === id);
            if (!page) return;
            editingPageId = id;
            document.getElementById('pageModalTitle').innerText = "Edit Page";
            document.getElementById('pageTitleInput').value = page.title;
            document.getElementById('pageImageInput').value = page.imageUrl || "";
            document.getElementById('pageContentInput').value = page.content;
            pageModal.style.display = "flex";
        };

        window.deletePage = async (id) => {
            if (confirm("Are you sure you want to delete this page?")) {
                await deleteDoc(doc(db, "pages", id));
            }
        };

        document.getElementById('savePageBtn').onclick = async () => {
            const title = document.getElementById('pageTitleInput').value.trim();
            const imageUrl = document.getElementById('pageImageInput').value.trim();
            const content = document.getElementById('pageContentInput').value.trim();

            if (!title || !content) return alert("Title and Content are required.");

            if (editingPageId) {
                await updateDoc(doc(db, "pages", editingPageId), { title, imageUrl, content });
            } else {
                await addDoc(collection(db, "pages"), {
                    categoryId: activeCategoryId,
                    title,
                    imageUrl,
                    content,
                    likedBy: [],
                    dislikedBy: [],
                    createdAt: serverTimestamp()
                });
            }
            pageModal.style.display = "none";
        };

        // Close Modal Controls
        document.getElementById('closeCatModal').onclick = () => categoryModal.style.display = "none";
        document.getElementById('closePageModal').onclick = () => pageModal.style.display = "none";
    </script>
</body>
</html>
